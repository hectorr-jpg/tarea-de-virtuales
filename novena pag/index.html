<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia de Calor - Ley de Enfriamiento</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌡️ Ley de Enfriamiento de Newton</h1>
            <p class="description">
                Calcula la temperatura de un objeto después de un tiempo determinado<br>
                usando la fórmula: <strong>T = T<sub>S</sub> + (T<sub>0</sub> - T<sub>S</sub>)e<sup>-kt</sup></strong>
            </p>

            <form id="calorForm">
                <div class="input-group">
                    <label>🌡️ Temperatura inicial (T<sub>0</sub>):</label>
                    <input type="number" id="tempInicial" step="any" placeholder="Ej: 120" required>
                    <span class="unit">°F</span>
                </div>

                <div class="input-group">
                    <label>❄️ Temperatura del ambiente (T<sub>S</sub>):</label>
                    <input type="number" id="tempAmbiente" step="any" placeholder="Ej: 38" required>
                    <span class="unit">°F</span>
                </div>

                <div class="input-group">
                    <label>📊 Constante k:</label>
                    <input type="number" id="constanteK" step="any" placeholder="Ej: 0.45" required>
                    <span class="unit">1/hora</span>
                </div>

                <div class="input-group">
                    <label>⏱️ Tiempo transcurrido (t):</label>
                    <input type="number" id="tiempo" step="any" placeholder="Ej: 3" required>
                    <span class="unit">horas</span>
                </div>

                <button type="button" id="calcularBtn">Calcular temperatura</button>
            </form>

            <div id="resultado" class="resultado">
                <p>✨ Ingresa los datos y presiona el botón ✨</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
